# Ledger as a Home Assistant add-on. Home Assistant downloads it ready-made (the image below, at this
# version), so nothing is built on your own machine.
name: Ledger
version: "0.1.34"
image: "ghcr.io/moeckjeremy/ledger-home-finance-addon"
slug: ledger
description: A private household budget, bills, debt and tax-estimate app that keeps its data on your own machine
url: "https://github.com/moeckjeremy/ledger-home-finance"
arch:
  - aarch64
  - amd64
init: false
# If Ledger stops answering, Home Assistant starts it again.
watchdog: tcp://[HOST]:[PORT:4317]
# Opened from the sidebar. Home Assistant signs you in, so Ledger asks for no password of its own there.
ingress: true
# Lets Ledger use the AI you have set up in Home Assistant (its AI Task), if you choose that in Ledger's
# Settings. Ledger calls nothing else in Home Assistant, and not even that unless you switch it on.
homeassistant_api: true
ingress_port: 4317
panel_icon: mdi:cash-multiple
panel_title: Ledger
# Not opened on the network unless you choose a port here. Set a Ledger password (Settings) before you do.
ports:
  4317/tcp: null
ports_description:
  4317/tcp: Ledger outside the sidebar (optional; set a Ledger password first)
environment:
  LEDGER_INGRESS: "1"
  LEDGER_FRESH: "1"
# The database lives in the add-on's own /data folder and is part of Home Assistant's backups.
# Cold: Home Assistant stops Ledger for the few seconds a backup takes, so the database is copied whole.
backup: cold
